name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Check
        run: uv run --locked prek run --all-files

      - name: Test
        run: uv run --locked --all-extras pytest

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://collector.invalid
        run: >-
          uv run --isolated --no-project --with dist/dst_server-*.whl python -I -c
          "import dst_server.cluster.cli;
          from dst_server.cluster.service import configure_otel;
          from dst_server.runtime import ServerConfig;
          assert configure_otel(ServerConfig(shard='smoke')) is None"
