name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.0.1

      - id: verify
        name: Verify tag matches pyproject.toml and main
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          project_version="$(uv version --short)"

          if [[ "${version}" != "${project_version}" ]]; then
            echo "::error::Tag ${tag} does not match project version ${project_version}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Tag ${tag} must point to a commit reachable from origin/main."
            exit 1
          fi

          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-tag
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Run tests
        run: uv run --locked --all-extras pytest

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://collector.invalid
          OTEL_SDK_DISABLED: 'true'
        run: >-
          uv run --isolated --no-project --with dist/dst_server-*.whl python -I -c
          "import dst_server.cluster.cli;
          from dst_server.cluster.service import configure_otel;
          from dst_server.runtime import ServerConfig;
          assert configure_otel(ServerConfig(shard='smoke')) is None"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish-github-draft:
    name: Create GitHub draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - verify-tag
      - build
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Create or update GitHub draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.verify-tag.outputs.tag }}
          name: ${{ needs.verify-tag.outputs.tag }}
          draft: true
          allowUpdates: true
          artifacts: dist/*
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          makeLatest: false
          removeArtifacts: true
          skipIfReleaseExists: true
          updateOnlyUnreleased: true

  publish-testpypi:
    name: Publish package distributions to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - verify-tag
      - build
      - publish-github-draft
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dst-server/${{ needs.verify-tag.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish package distributions to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - verify-tag
      - build
      - publish-testpypi
    environment:
      name: pypi
      url: https://pypi.org/project/dst-server/${{ needs.verify-tag.outputs.version }}/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish GitHub draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.verify-tag.outputs.tag }}
          allowUpdates: true
          draft: false
          makeLatest: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          skipIfReleaseExists: true
          updateOnlyUnreleased: true
