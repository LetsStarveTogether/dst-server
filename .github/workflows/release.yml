name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.1.0

      - id: verify
        name: Verify tag matches Cargo.toml and main
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"

          if [[ "${version}" != "${project_version}" ]]; then
            echo "::error::Tag ${tag} does not match project version ${project_version}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Tag ${tag} must point to a commit reachable from origin/main."
            exit 1
          fi

          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    name: Build Linux x86_64 binary, CPython 3.14 wheel and source distribution
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'

      - name: Build distributions against the game image libc
        shell: bash
        run: |
          set -euo pipefail
          podman build --target distributions --file Containerfile \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg NATIVE_SCRIPTS_REVISION="$(git -C dst-scripts/scripts rev-parse HEAD)" \
            --tag dst-server-distributions .
          container=$(podman create dst-server-distributions /bin/true)
          trap 'podman rm "$container"' EXIT
          mkdir dist
          podman cp "$container:/out/." dist/

      - name: Verify isolated release wheel
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends capnproto lua5.1 luajit
          cargo build --locked -p dst-server --example rpc_fixture
          uv venv .wheel-check --python 3.14
          uv pip install --python .wheel-check/bin/python --no-deps dist/python/*.whl
          .wheel-check/bin/python -I tests/rust/check_binding.py "$PWD/target/debug/examples/rpc_fixture" "$PWD/dist/native/dst-server-linux-x86_64"
          for check in tests/rust/check_*.py; do
            case "$check" in */check_binding.py|*/check_lua.py) continue ;; esac
            .wheel-check/bin/python -I "$check"
          done
          for check in tests/rust/check_*_cli.py; do
            .wheel-check/bin/python -I "$check" "$PWD/dist/native/dst-server-linux-x86_64"
          done
          .wheel-check/bin/dst-server --version
          dist/native/dst-server-linux-x86_64 --version
          dist/native/dst-server-linux-x86_64 describe > /dev/null

      - name: Upload release distributions and manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish-github-draft:
    name: Create GitHub draft release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - verify-tag
      - build
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist

      - name: Create or update GitHub draft release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.verify-tag.outputs.tag }}
          name: ${{ needs.verify-tag.outputs.tag }}
          draft: true
          allowUpdates: true
          artifacts: dist/python/*,dist/native/*,dist/build-manifest.json
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          makeLatest: false
          removeArtifacts: true
          updateOnlyUnreleased: true

  publish-testpypi:
    name: Publish package distributions to TestPyPI
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - verify-tag
      - build
      - publish-github-draft
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dst-server/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/python
          skip-existing: true

  publish-pypi:
    name: Publish package distributions to PyPI
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - verify-tag
      - build
      - publish-testpypi
    environment:
      name: pypi
      url: https://pypi.org/project/dst-server/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/python

      - name: Publish GitHub draft release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.verify-tag.outputs.tag }}
          allowUpdates: true
          draft: false
          makeLatest: legacy
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          updateOnlyUnreleased: true
