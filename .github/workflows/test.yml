name: Test

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Lua test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1 luajit

      - name: Install Python test dependencies
        run: uv sync --locked --all-extras --no-default-groups --group dev

      - name: Check repository files
        # The local aggregate hook uses just; its checks run explicitly below.
        run: uv run --no-sync -- prek run --all-files --show-diff-on-failure --skip just-check

      - name: Check Python formatting
        run: uv run --no-sync -- ruff format --check .

      - name: Lint Python
        run: uv run --no-sync -- ruff check --no-fix .

      - name: Check types
        run: uv run --no-sync -- ty check

      - name: Check Markdown
        run: uv run --no-sync -- rumdl check .

      - name: Run tests
        run: uv run --no-sync -- pytest tests -m 'not system'

      - name: Build distributions
        run: uv build --clear --out-dir dist --no-create-gitignore --no-sources

      - name: Verify installed wheel
        run: uv run --isolated --no-project --no-config --with dist/dst_server-*.whl -- python -I tests/distribution.py
