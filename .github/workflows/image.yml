name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target on current main (latest, beta, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - latest
          - beta
      force_build:
        description: 'Build even when this game version is already published'
        required: false
        default: false
        type: boolean
      real_game_tests:
        description: 'Run native probes with 1, 2, and 5 worlds'
        required: false
        default: false
        type: boolean
      no_cache:
        description: 'Rebuild without using cached image layers'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDS_URL: https://s3.amazonaws.com/dstbuilds/builds.json
  IMAGE_NAME: dst-server
  IMAGE_REGISTRY: quay.io/wh2099

jobs:
  sync-dst-scripts:
    name: Sync DST scripts
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.update-dst-scripts-reference.outputs.revision }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          submodules: true

      - name: Update DST scripts reference
        id: update-dst-scripts-reference
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --remote --checkout dst-scripts/scripts
          git add dst-scripts/scripts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(deps): update dst-scripts'
            git push origin HEAD:main
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Verify SDK
    needs: sync-dst-scripts
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      revision: ${{ needs.sync-dst-scripts.outputs.revision }}

  detect:
    name: Resolve image versions
    needs: sync-dst-scripts
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Resolve image versions
        id: detect
        uses: actions/github-script@v9.0.0
        env:
          BUILD_TARGET: ${{ inputs.build_target || 'both' }}
          FORCE_BUILD: ${{ inputs.force_build }}
          SOURCE_REVISION: ${{ needs.sync-dst-scripts.outputs.revision }}
        with:
          script: |
            const fs = require('node:fs/promises');

            const buildTarget = process.env.BUILD_TARGET;
            const forceBuild = process.env.FORCE_BUILD === 'true';
            const targets = [
              { tag: 'latest', beta: '', channel: 'release', upstream: 'release' },
              { tag: 'beta', beta: '1', channel: 'beta', upstream: 'updatebeta' },
            ];
            const selectedTargets = targets.filter(({ tag }) => buildTarget === 'both' || tag === buildTarget);
            const isVersion = (version) => /^\d+$/.test(version) && Number.isSafeInteger(Number(version));

            let builds;
            const upstreamVersion = async (channel) => {
              if (!builds) {
                const response = await fetch(process.env.BUILDS_URL);
                if (!response.ok) {
                  throw new Error(`Failed to fetch builds.json: ${response.status} ${response.statusText}`);
                }
                builds = await response.json();
              }

              const version = Math.max(
                ...(Array.isArray(builds[channel]) ? builds[channel] : []).filter(isVersion).map(Number),
              );
              if (!Number.isSafeInteger(version)) {
                throw new Error(`No numeric version found for ${channel}`);
              }

              return String(version);
            };

            const publishedVersion = async (target) => {
              const image = `docker://${process.env.IMAGE_REGISTRY}/${process.env.IMAGE_NAME}:${target.tag}`;
              const format = [
                '{{ index .Labels "org.opencontainers.image.version" }}',
                '{{ index .Labels "io.github.letsstarvetogether.dst.channel" }}',
                '{{ index .Labels "org.opencontainers.image.revision" }}',
              ].join('|');
              const result = await exec.getExecOutput('skopeo', ['inspect', '--format', format, image], {
                ignoreReturnCode: true,
                silent: true,
              });
              const [version, channel, revision] = result.stdout.trim().split('|');

              if (result.exitCode === 0 && isVersion(version) && channel === target.channel && revision === process.env.SOURCE_REVISION) {
                return version;
              }

              core.warning(`No matching build metadata found for ${target.tag}`);
              return undefined;
            };

            const matrix = [];
            const summary = [];
            const created = new Date().toISOString();

            for (const target of selectedTargets) {
              const version = await upstreamVersion(target.upstream);
              const build = context.eventName === 'push' || forceBuild || (await publishedVersion(target)) !== version;
              summary.push(`${build ? 'Build' : 'Skip'} ${target.tag} ${version}`);

              matrix.push({
                beta: target.beta,
                build,
                channel: target.channel,
                created,
                image_tag: target.tag,
                version,
                version_tag: target.channel === 'beta' ? `beta-${version}` : version,
              });
            }

            core.setOutput('matrix', JSON.stringify({ include: matrix }));
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);

  image:
    name: ${{ matrix.build && 'Build' || 'Skip' }} ${{ matrix.image_tag }} ${{ matrix.version }}
    needs: [sync-dst-scripts, detect, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        if: ${{ matrix.build }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync-dst-scripts.outputs.revision }}
          persist-credentials: false
          submodules: true

      - name: Log in to registry for build cache
        if: ${{ matrix.build }}
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | podman login quay.io \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Record pinned native Lua revision
        if: ${{ matrix.build }}
        id: source
        run: printf 'revision=%s\n' "$(git -C dst-scripts/scripts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        if: ${{ matrix.build }}
        id: build
        uses: redhat-actions/buildah-build@v3.1.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ matrix.version_tag }} ${{ matrix.image_tag }}
          containerfiles: Containerfile
          layers: true
          # ponytail: final-image cache aliases persist; strict expiry needs separate publication.
          extra-args: |
            --pull=always
            --network=host
            --cache-from=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
            --cache-to=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
            --layer-label=quay.expires-after=7d
            ${{ inputs.no_cache && '--no-cache' || '' }}
          build-args: |
            BETA=${{ matrix.beta }}
            GAME_VERSION=${{ matrix.version }}
            SOURCE_REVISION=${{ needs.sync-dst-scripts.outputs.revision }}
            NATIVE_SCRIPTS_REVISION=${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ needs.sync-dst-scripts.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ matrix.created }}
            org.opencontainers.image.licenses=MIT
            io.github.letsstarvetogether.dst.channel=${{ matrix.channel }}

      - name: Test native contracts from built image
        if: ${{ matrix.build }}
        id: native
        shell: bash
        env:
          DST_SERVER_IMAGE: ${{ steps.build.outputs.image-with-tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1 luajit
          native_dir=$(mktemp -d)
          printf 'directory=%s\n' "$native_dir" >> "$GITHUB_OUTPUT"
          native_container=$(podman create "$DST_SERVER_IMAGE")
          trap 'podman rm --volumes "$native_container"' EXIT
          podman cp "$native_container:/install/data/databundles/scripts.zip" "$native_dir/scripts.zip"
          podman cp "$native_container:/usr/local/bin/dst-server" "$native_dir/dst-server"
          podman cp "$native_container:/usr/local/share/dst-server/build-manifest.json" "$native_dir/build-manifest.json"
          "$native_dir/dst-server" scripts verify "$native_dir/scripts.zip"
          python3 -m zipfile -e "$native_dir/scripts.zip" "$native_dir/source"
          python3 tests/rust/check_lua.py --scripts "$native_dir/source/scripts"
          podman run --rm --entrypoint /usr/local/bin/dst-server "$DST_SERVER_IMAGE" --version

      - name: Test built image with the real game
        if: ${{ matrix.build && inputs.real_game_tests }}
        timeout-minutes: 60
        shell: bash
        env:
          DST_SERVER_IMAGE: ${{ steps.build.outputs.image-with-tag }}
          NATIVE_DIRECTORY: ${{ steps.native.outputs.directory }}
        run: |
          set -euo pipefail
          podman save --format oci-archive "$DST_SERVER_IMAGE" | sudo podman load
          sudo -E python3 tests/rust/native_acceptance.py --image "$DST_SERVER_IMAGE" \
            --binary "$NATIVE_DIRECTORY/dst-server" \
            --source-scripts "$NATIVE_DIRECTORY/scripts.zip" \
            --output "$RUNNER_TEMP/native-acceptance"

      - name: Upload native image verification reports
        if: ${{ always() && matrix.build }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-image-${{ matrix.image_tag }}-${{ matrix.version }}-${{ github.run_attempt }}
          path: |
            ${{ steps.native.outputs.directory }}/build-manifest.json
            ${{ runner.temp }}/native-acceptance/**/*.json
            ${{ runner.temp }}/native-acceptance/**/*.log
          if-no-files-found: warn

      - name: Push to registry
        if: ${{ matrix.build }}
        uses: redhat-actions/push-to-registry@v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
