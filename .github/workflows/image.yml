name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - '.containerignore'
      - '.github/workflows/image.yml'
      - 'Containerfile'
      - 'src/**'
      - 'tests/test_podman.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (latest, beta, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - latest
          - beta
      force_build:
        description: 'Build even when this game version is already published'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDS_URL: https://s3.amazonaws.com/dstbuilds/builds.json
  IMAGE_NAME: dst-server
  IMAGE_REGISTRY: quay.io/wh2099

jobs:
  test:
    name: Test Python supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Test
        run: uv run --locked --all-extras pytest

  detect:
    name: Resolve image versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Resolve image versions
        id: detect
        uses: actions/github-script@v9
        env:
          BUILD_TARGET: ${{ inputs.build_target || 'both' }}
          FORCE_BUILD: ${{ inputs.force_build }}
        with:
          script: |
            const fs = require('node:fs/promises');

            const buildTarget = process.env.BUILD_TARGET;
            const forceBuild = process.env.FORCE_BUILD === 'true';
            const targets = [
              { tag: 'latest', beta: '', channel: 'release', upstream: 'release' },
              { tag: 'beta', beta: '1', channel: 'beta', upstream: 'updatebeta' },
            ];
            const selectedTargets = targets.filter(({ tag }) => buildTarget === 'both' || tag === buildTarget);
            const isVersion = (version) => /^\d+$/.test(version) && Number.isSafeInteger(Number(version));

            let builds;
            const upstreamVersion = async (channel) => {
              if (!builds) {
                const response = await fetch(process.env.BUILDS_URL);
                if (!response.ok) {
                  throw new Error(`Failed to fetch builds.json: ${response.status} ${response.statusText}`);
                }
                builds = await response.json();
              }

              const version = Math.max(
                ...(Array.isArray(builds[channel]) ? builds[channel] : []).filter(isVersion).map(Number),
              );
              if (!Number.isSafeInteger(version)) {
                throw new Error(`No numeric version found for ${channel}`);
              }

              return String(version);
            };

            const publishedVersion = async (target) => {
              const image = `docker://${process.env.IMAGE_REGISTRY}/${process.env.IMAGE_NAME}:${target.tag}`;
              const format = [
                '{{ index .Labels "org.opencontainers.image.version" }}',
                '{{ index .Labels "io.github.letsstarvetogether.dst.channel" }}',
              ].join('|');
              const result = await exec.getExecOutput('skopeo', ['inspect', '--format', format, image], {
                ignoreReturnCode: true,
                silent: true,
              });
              const [version, channel] = result.stdout.trim().split('|');

              if (result.exitCode === 0 && isVersion(version) && channel === target.channel) {
                return version;
              }

              core.warning(`No valid build metadata found for ${target.tag}`);
              return undefined;
            };

            const matrix = [];
            const summary = [];
            const created = new Date().toISOString();

            for (const target of selectedTargets) {
              const published = await publishedVersion(target);
              let build;
              let version;

              if (context.eventName === 'push') {
                version = await upstreamVersion(target.upstream);
                build = true;
                summary.push(`${published ? 'Rebuild' : 'Bootstrap'} ${target.tag} ${version}`);
              } else {
                version = await upstreamVersion(target.upstream);
                build = forceBuild || published !== version;
                summary.push(`${build ? 'Build' : 'Skip'} ${target.tag} ${version}`);
              }

              matrix.push({
                beta: target.beta,
                build,
                channel: target.channel,
                created,
                image_tag: target.tag,
                version,
                version_tag: version,
              });
            }

            core.setOutput('matrix', JSON.stringify({ include: matrix }));
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);

  image:
    name: ${{ matrix.build && 'Build' || 'Skip' }} ${{ matrix.image_tag }} ${{ matrix.version }}
    needs: [detect, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        if: ${{ matrix.build }}
        uses: actions/checkout@v7

      - name: Build image
        if: ${{ matrix.build }}
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ matrix.version_tag }} ${{ matrix.image_tag }}
          containerfiles: Containerfile
          build-args: |
            BETA=${{ matrix.beta }}
            GAME_VERSION=${{ matrix.version }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ matrix.created }}
            org.opencontainers.image.licenses=MIT
            io.github.letsstarvetogether.dst.channel=${{ matrix.channel }}

      - name: Setup uv for image tests
        if: ${{ matrix.build }}
        uses: astral-sh/setup-uv@v10.0.1

      - name: Test built image with the real game
        if: ${{ matrix.build }}
        timeout-minutes: 30
        env:
          DST_SERVER_EXPECTED_REVISION: ${{ github.sha }}
          DST_SERVER_EXPECTED_VERSION: ${{ matrix.version }}
          DST_SERVER_IMAGE: ${{ steps.build.outputs.image-with-tag }}
          DST_SERVER_PODMAN_TEST: '1'
        run: |
          podman save "$DST_SERVER_IMAGE" | sudo podman load
          sudo --preserve-env=DST_SERVER_EXPECTED_REVISION,DST_SERVER_EXPECTED_VERSION,DST_SERVER_IMAGE,DST_SERVER_PODMAN_TEST \
            "$(command -v uv)" run --locked --all-extras pytest -m system tests/test_podman.py

      - name: Push to registry
        if: ${{ matrix.build }}
        id: push
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Verify registry metadata
        if: ${{ matrix.build }}
        env:
          EXPECTED_CHANNEL: ${{ matrix.channel }}
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ matrix.version }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          VERSION_TAG: ${{ matrix.version_tag }}
        shell: bash
        run: |
          set -euo pipefail

          for tag in "${IMAGE_TAG}" "${VERSION_TAG}"; do
            read -r digest version revision channel <<< "$(
              skopeo inspect \
                --format '{{ .Digest }} {{ index .Labels "org.opencontainers.image.version" }} {{ index .Labels "org.opencontainers.image.revision" }} {{ index .Labels "io.github.letsstarvetogether.dst.channel" }}' \
                "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            )"

            [[ "${version}" == "${EXPECTED_VERSION}" ]]
            [[ "${revision}" == "${EXPECTED_REVISION}" ]]
            [[ "${channel}" == "${EXPECTED_CHANNEL}" ]]
            [[ "${digest}" == "${EXPECTED_DIGEST}" ]]
          done
